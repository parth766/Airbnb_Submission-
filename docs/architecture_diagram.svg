<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1100" width="100%" height="100%" style="background-color: #0F172A; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;">
  <!-- Definitions for gradients and shadows -->
  <defs>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF385C" />
      <stop offset="100%" stop-color="#E00B41" />
    </linearGradient>
    <linearGradient id="cardGrad1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="feGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#1E3A8A" stop-opacity="0.4" />
    </linearGradient>
    <linearGradient id="beGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#064E3B" stop-opacity="0.4" />
    </linearGradient>
    <linearGradient id="dbGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#78350F" stop-opacity="0.4" />
    </linearGradient>
    <linearGradient id="searchGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#4C1D95" stop-opacity="0.4" />
    </linearGradient>

    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Title Banner -->
  <rect x="0" y="0" width="1600" height="90" fill="url(#headerGrad)" />
  <text x="50" y="52" fill="#FFFFFF" font-size="28" font-weight="800" letter-spacing="0.5">AIRBNB SCALE MARKETPLACE — SYSTEM ARCHITECTURE</text>
  <text x="1100" y="52" fill="#FFFFFF" font-size="16" font-weight="600" opacity="0.9">Production Architecture &amp; Scaling Blueprint</text>

  <!-- Diagram Outer Container -->
  <!-- Layer 1: Client & Global Anycast Edge -->
  <g filter="url(#shadow)">
    <rect x="50" y="120" width="1500" height="170" rx="16" fill="url(#cardGrad1)" stroke="#38BDF8" stroke-width="1.5" />
    <text x="80" y="155" fill="#38BDF8" font-size="18" font-weight="700">1. GLOBAL ANYCAST EDGE &amp; CLIENT LAYER</text>

    <!-- Edge Cards -->
    <rect x="80" y="175" width="260" height="90" rx="12" fill="url(#feGrad)" stroke="#38BDF8" stroke-width="1" />
    <text x="100" y="205" fill="#FFFFFF" font-size="15" font-weight="700">Client Browsers &amp; Apps</text>
    <text x="100" y="230" fill="#94A3B8" font-size="12">Desktop React / Mobile Apps</text>
    <text x="100" y="248" fill="#94A3B8" font-size="12">HTTP/3, WebSockets, TLS 1.3</text>

    <rect x="380" y="175" width="320" height="90" rx="12" fill="url(#feGrad)" stroke="#38BDF8" stroke-width="1" />
    <text x="400" y="205" fill="#FFFFFF" font-size="15" font-weight="700">Cloudflare Anycast Edge CDN</text>
    <text x="400" y="230" fill="#94A3B8" font-size="12">DDoS Shield, Bot Management</text>
    <text x="400" y="248" fill="#94A3B8" font-size="12">Static Asset &amp; Media Caching</text>

    <rect x="750" y="175" width="340" height="90" rx="12" fill="url(#feGrad)" stroke="#38BDF8" stroke-width="1" />
    <text x="770" y="205" fill="#FFFFFF" font-size="15" font-weight="700">Next.js Edge SSR / ISR Cluster</text>
    <text x="770" y="230" fill="#94A3B8" font-size="12">Server-Side Rendering &amp; Revalidation</text>
    <text x="770" y="248" fill="#94A3B8" font-size="12">HTML Streaming &amp; Dynamic Headers</text>

    <rect x="1140" y="175" width="380" height="90" rx="12" fill="url(#feGrad)" stroke="#38BDF8" stroke-width="1" />
    <text x="1160" y="205" fill="#FFFFFF" font-size="15" font-weight="700">Imgix / CloudFront Image Pipeline</text>
    <text x="1160" y="230" fill="#94A3B8" font-size="12">On-the-fly AVIF/WebP Resizing</text>
    <text x="1160" y="248" fill="#94A3B8" font-size="12">Responsive Image CDN Delivery</text>
  </g>

  <!-- Layer 2: API Gateway & Microservices -->
  <g filter="url(#shadow)">
    <rect x="50" y="320" width="1500" height="240" rx="16" fill="url(#cardGrad1)" stroke="#34D399" stroke-width="1.5" />
    <text x="80" y="355" fill="#34D399" font-size="18" font-weight="700">2. API GATEWAY &amp; CORE MICROSERVICES LAYER</text>

    <rect x="80" y="375" width="260" height="160" rx="12" fill="url(#beGrad)" stroke="#34D399" stroke-width="1" />
    <text x="100" y="405" fill="#FFFFFF" font-size="15" font-weight="700">Kong / Envoy API Gateway</text>
    <text x="100" y="430" fill="#94A3B8" font-size="12">• OAuth2 / JWT Auth Validation</text>
    <text x="100" y="450" fill="#94A3B8" font-size="12">• Distributed Rate Limiting</text>
    <text x="100" y="470" fill="#94A3B8" font-size="12">• gRPC Routing &amp; Proxy</text>
    <text x="100" y="490" fill="#94A3B8" font-size="12">• WAF Security Rules</text>

    <!-- Services Grid -->
    <rect x="380" y="375" width="260" height="70" rx="10" fill="url(#beGrad)" stroke="#34D399" stroke-width="1" />
    <text x="395" y="405" fill="#FFFFFF" font-size="14" font-weight="700">Listing Service</text>
    <text x="395" y="425" fill="#94A3B8" font-size="11">Property metadata, photos &amp; amenities</text>

    <rect x="660" y="375" width="260" height="70" rx="10" fill="url(#beGrad)" stroke="#34D399" stroke-width="1" />
    <text x="675" y="405" fill="#FFFFFF" font-size="14" font-weight="700">Reservation Lock Service</text>
    <text x="675" y="425" fill="#94A3B8" font-size="11">Redlock atomic booking lock engine</text>

    <rect x="940" y="375" width="260" height="70" rx="10" fill="url(#beGrad)" stroke="#34D399" stroke-width="1" />
    <text x="955" y="405" fill="#FFFFFF" font-size="14" font-weight="700">Dynamic Pricing Service</text>
    <text x="955" y="425" fill="#94A3B8" font-size="11">Demand-based seasonal pricing</text>

    <rect x="1220" y="375" width="300" height="70" rx="10" fill="url(#beGrad)" stroke="#34D399" stroke-width="1" />
    <text x="1235" y="405" fill="#FFFFFF" font-size="14" font-weight="700">User &amp; Host Service</text>
    <text x="1235" y="425" fill="#94A3B8" font-size="11">Profiles, verification &amp; reviews</text>

    <rect x="380" y="465" width="260" height="70" rx="10" fill="url(#beGrad)" stroke="#34D399" stroke-width="1" />
    <text x="395" y="495" fill="#FFFFFF" font-size="14" font-weight="700">Messaging &amp; Chat Service</text>
    <text x="395" y="515" fill="#94A3B8" font-size="11">Realtime WebSocket host-guest chat</text>

    <rect x="660" y="465" width="260" height="70" rx="10" fill="url(#beGrad)" stroke="#34D399" stroke-width="1" />
    <text x="675" y="495" fill="#FFFFFF" font-size="14" font-weight="700">Payment &amp; Payout Engine</text>
    <text x="675" y="515" fill="#94A3B8" font-size="11">Stripe / Escrow payout processing</text>

    <rect x="940" y="465" width="260" height="70" rx="10" fill="url(#beGrad)" stroke="#34D399" stroke-width="1" />
    <text x="955" y="495" fill="#FFFFFF" font-size="14" font-weight="700">Review &amp; Rating Service</text>
    <text x="955" y="515" fill="#94A3B8" font-size="11">Double-blind review system</text>

    <rect x="1220" y="465" width="300" height="70" rx="10" fill="url(#beGrad)" stroke="#34D399" stroke-width="1" />
    <text x="1235" y="495" fill="#FFFFFF" font-size="14" font-weight="700">Notification Engine</text>
    <text x="1235" y="515" fill="#94A3B8" font-size="11">Email, SMS &amp; Push notifications</text>
  </g>

  <!-- Layer 3: Search, Geolocation & Event Bus -->
  <g filter="url(#shadow)">
    <rect x="50" y="590" width="1500" height="190" rx="16" fill="url(#cardGrad1)" stroke="#A78BFA" stroke-width="1.5" />
    <text x="80" y="625" fill="#A78BFA" font-size="18" font-weight="700">3. SEARCH, GEOLOCATION &amp; EVENT STREAMING</text>

    <rect x="80" y="645" width="430" height="110" rx="12" fill="url(#searchGrad)" stroke="#A78BFA" stroke-width="1" />
    <text x="100" y="675" fill="#FFFFFF" font-size="15" font-weight="700">Elasticsearch / OpenSearch Cluster</text>
    <text x="100" y="700" fill="#94A3B8" font-size="12">• Uber H3 Spatial Indexing &amp; Bounding Box Queries</text>
    <text x="100" y="720" fill="#94A3B8" font-size="12">• Instant date availability filtering &amp; faceted search</text>

    <rect x="540" y="645" width="480" height="110" rx="12" fill="url(#searchGrad)" stroke="#A78BFA" stroke-width="1" />
    <text x="560" y="675" fill="#FFFFFF" font-size="15" font-weight="700">Apache Kafka Event Bus &amp; CDC</text>
    <text x="560" y="700" fill="#94A3B8" font-size="12">• Debezium Change Data Capture for Realtime Sync</text>
    <text x="560" y="720" fill="#94A3B8" font-size="12">• Event Topics: Bookings, Reviews, Payments, Logs</text>

    <rect x="1050" y="645" width="470" height="110" rx="12" fill="url(#searchGrad)" stroke="#A78BFA" stroke-width="1" />
    <text x="1070" y="675" fill="#FFFFFF" font-size="15" font-weight="700">Redis Enterprise Distributed Cluster</text>
    <text x="1070" y="700" fill="#94A3B8" font-size="12">• Multi-region L2 Session &amp; Listing Cache</text>
    <text x="1070" y="720" fill="#94A3B8" font-size="12">• Rate-limit counters &amp; lock synchronizations</text>
  </g>

  <!-- Layer 4: Storage, Database & Infrastructure -->
  <g filter="url(#shadow)">
    <rect x="50" y="810" width="1500" height="230" rx="16" fill="url(#cardGrad1)" stroke="#FBBF24" stroke-width="1.5" />
    <text x="80" y="845" fill="#FBBF24" font-size="18" font-weight="700">4. PERSISTENT STORAGE, MULTI-REGION DB &amp; DEPLOYMENT INFRASTRUCTURE</text>

    <rect x="80" y="865" width="430" height="150" rx="12" fill="url(#dbGrad)" stroke="#FBBF24" stroke-width="1" />
    <text x="100" y="895" fill="#FFFFFF" font-size="15" font-weight="700">CockroachDB / Multi-Region Postgres</text>
    <text x="100" y="920" fill="#94A3B8" font-size="12">• Active-Active Distributed SQL (US-East, EU-West, AP-South)</text>
    <text x="100" y="940" fill="#94A3B8" font-size="12">• ACID Compliance for Reservations &amp; Payments</text>
    <text x="100" y="960" fill="#94A3B8" font-size="12">• Automated Sharding &amp; Locality-Aware Partitioning</text>

    <rect x="540" y="865" width="480" height="150" rx="12" fill="url(#dbGrad)" stroke="#FBBF24" stroke-width="1" />
    <text x="560" y="895" fill="#FFFFFF" font-size="15" font-weight="700">AWS S3 / Google Cloud Object Storage</text>
    <text x="560" y="920" fill="#94A3B8" font-size="12">• Multi-region replicated high-resolution property photo storage</text>
    <text x="560" y="940" fill="#94A3B8" font-size="12">• Automated lifecycle policies &amp; cold archival storage</text>
    <text x="560" y="960" fill="#94A3B8" font-size="12">• Direct presigned URL uploads from host devices</text>

    <rect x="1050" y="865" width="470" height="150" rx="12" fill="url(#dbGrad)" stroke="#FBBF24" stroke-width="1" />
    <text x="1070" y="895" fill="#FFFFFF" font-size="15" font-weight="700">Kubernetes (EKS/GKE) Multi-Region Deployment</text>
    <text x="1070" y="920" fill="#94A3B8" font-size="12">• ArgoCD GitOps Continuous Deployment Pipeline</text>
    <text x="1070" y="940" fill="#94A3B8" font-size="12">• Horizontal Pod Autoscaler (HPA) based on CPU/RPS</text>
    <text x="1070" y="960" fill="#94A3B8" font-size="12">• Datadog APM, Prometheus &amp; Grafana Observability</text>
  </g>
</svg>
